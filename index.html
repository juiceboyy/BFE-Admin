<!DOCTYPE html>
<html lang="nl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Big Fish Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';</script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="antialiased min-h-screen p-8 selection:bg-blue-200">
    <div class="max-w-5xl mx-auto">

        <header class="flex justify-between items-center mb-12 mt-8">
            <div>
                <h1 class="text-3xl font-semibold tracking-tight">Overzicht</h1>
                <p class="text-gray-500 text-sm mt-1">Big Fish Entertainment</p>
            </div>
            <div class="flex gap-3">
                <button id="auth-btn"
                    class="flex items-center gap-2 bg-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm border border-gray-200 hover:shadow-md transition-all text-gray-700">
                    <i data-lucide="cloud-download" class="w-4 h-4"></i> Sync Drive
                </button>
                <button
                    class="flex items-center gap-2 bg-black text-white px-4 py-2 rounded-xl text-sm font-medium shadow-sm hover:bg-gray-800 transition-colors">
                    <i data-lucide="plus" class="w-4 h-4"></i> Nieuwe Btw-aangifte
                </button>
            </div>
        </header>

        <div id="app-content" class="grid grid-cols-1 lg:grid-cols-3 gap-8">

            <details class="bg-white shadow rounded-lg group lg:col-span-3">
                <summary class="cursor-pointer p-4 font-semibold text-gray-700 hover:bg-gray-50 rounded-lg outline-none select-none flex items-center justify-between">
                    <span>➕ Handmatige boeking toevoegen</span>
                    <span class="group-open:rotate-180 transition-transform">▼</span>
                </summary>
                <div class="p-4 border-t border-gray-100">
                    <form id="btw-form" class="space-y-5">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1.5">Type</label>
                            <select id="type"
                                class="w-full bg-white/60 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm">
                                <option value="inkomsten">Inkomsten (Omzet)</option>
                                <option value="uitgaven">Uitgaven (Kosten)</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1.5">Datum</label>
                            <input type="date" id="datum" required
                                class="w-full bg-white/60 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-gray-500 mb-1.5">Omschrijving</label>
                        <input type="text" id="omschrijving" placeholder="Bijv. Optreden / Studiohuur / Apparatuur"
                            required
                            class="w-full bg-white/60 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm">
                    </div>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-5">
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1.5">Bedrag (Excl. Btw)</label>
                            <div class="relative">
                                <span class="absolute left-4 top-2.5 text-gray-500 text-sm">€</span>
                                <input type="number" step="0.01" id="bedrag" placeholder="0.00" required
                                    class="w-full bg-white/60 border border-gray-200 rounded-xl pl-8 pr-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-medium text-gray-500 mb-1.5">Btw-tarief</label>
                            <select id="tarief"
                                class="w-full bg-white/60 border border-gray-200 rounded-xl px-4 py-2.5 outline-none focus:ring-2 focus:ring-blue-500/20 transition-all text-sm">
                                <option value="9">9% (Muziek/Optredens)</option>
                                <option value="21">21% (Algemeen)</option>
                                <option value="0">0%</option>
                                <option value="verlegd">Verlegd</option>
                            </select>
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full mt-2 bg-black text-white rounded-xl py-3 text-sm font-medium shadow-sm hover:bg-gray-800 transition-colors">
                        Boeking Toevoegen
                    </button>
                </form>
                </div>
            </details>

            <div class="glass-panel p-6 rounded-3xl lg:col-span-3">
                <h2 class="text-xl font-medium mb-6">Bonnen & Facturen Scanner</h2>
                
                <!-- Mode Toggle (Inkoop / Verkoop) -->
                <div class="flex justify-center mb-6">
                    <div class="bg-gray-100 p-1 rounded-lg inline-flex">
                        <button id="mode-inkoop" class="px-6 py-2 rounded-md text-sm font-medium transition-all bg-white text-gray-900 shadow-sm">Inkoop</button>
                        <button id="mode-verkoop" class="px-6 py-2 rounded-md text-sm font-medium transition-all text-gray-500 hover:text-gray-900">Verkoop</button>
                    </div>
                </div>

                <!-- Upload Zone -->
                <div class="relative border-2 border-dashed border-gray-300 rounded-xl p-8 text-center hover:border-blue-400 transition-colors group cursor-pointer">
                    <input type="file" id="receipt-upload" accept="image/*,application/pdf" multiple class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                    <div class="flex flex-col items-center gap-2 pointer-events-none">
                        <div class="p-3 bg-blue-50 text-blue-600 rounded-full group-hover:bg-blue-100 transition-colors">
                            <i data-lucide="scan-line" class="w-6 h-6"></i>
                        </div>
                        <p class="text-sm font-medium text-gray-700">Sleep een bestand hierheen of klik om te uploaden</p>
                        <p class="text-xs text-gray-400">Ondersteunt PDF, JPG, PNG</p>
                    </div>
                </div>

                <!-- Folder Upload Option -->
                <div class="mt-4 flex justify-center">
                    <label for="folder-upload" class="cursor-pointer flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 transition-colors">
                        <i data-lucide="folder-up" class="w-4 h-4"></i>
                        Of upload een hele map
                    </label>
                    <input type="file" id="folder-upload" webkitdirectory directory multiple class="hidden">
                </div>

                <!-- Batch Dashboard (Replaces Form) -->
                <div id="batch-dashboard" class="hidden w-full overflow-x-auto mt-8">
                    <table class="w-full text-sm text-left">
                        <thead class="text-xs text-gray-700 uppercase bg-gray-50 border-b">
                            <tr>
                                <th class="px-4 py-3 whitespace-nowrap">Bestand</th>
                                <th class="px-4 py-3 whitespace-nowrap">Status</th>
                                <th class="px-4 py-3 whitespace-nowrap">Datum</th>
                                <th id="th-leverancier" class="px-4 py-3 whitespace-nowrap">Leverancier</th>
                                <th class="px-4 py-3 whitespace-nowrap">Omschrijving</th>
                                <th id="th-bedrag" class="px-4 py-3 whitespace-nowrap text-right">Bedrag(excl)</th>
                                <th class="px-4 py-3 whitespace-nowrap text-right">BTW</th>
                                <th class="px-4 py-3 whitespace-nowrap">Factuurnr</th>
                                <th class="px-4 py-3 whitespace-nowrap text-center">Actie</th>
                            </tr>
                        </thead>
                        <tbody id="batch-table-body" class="divide-y divide-gray-100">
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
<script type="module" src="js/main.js"></script>

</html>
